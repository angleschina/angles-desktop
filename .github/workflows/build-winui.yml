name: build-winui

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths: [ 'Angles.Desktop/**', '.github/workflows/**' ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # WinUI3 的 PRI/资源编译依赖 Visual Studio 的 AppxPackage targets，
      # 必须走 MSBuild（dotnet publish 不会加载它们）。
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: MSBuild (win-x64 self-contained)
        run: |
          msbuild Angles.Desktop\Angles.Desktop.csproj -restore -t:Build ^
            -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 ^
            -p:WindowsAppSDKSelfContained=true -p:UseRidGraph=true

      - name: Pack zip
        shell: pwsh
        run: |
          $pub = "Angles.Desktop\bin\Release\net8.0-windows10.0.19041.0\win-x64"
          Get-ChildItem -Recurse $pub | Out-Null
          Compress-Archive -Path $pub\* -DestinationPath Angles-Desktop-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Angles-Desktop-win-x64
          path: Angles-Desktop-win-x64.zip
          if-no-files-found: error

      # 打 tag（v0.1.0 等）时额外发一个 GitHub Release
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Angles Desktop ${{ github.ref_name }}
          body: |
            WinUI 3 unpackaged desktop shell，win-x64 self-contained 发布。

            > git fetch --tags && git checkout <tag>
            > Angles-Desktop-win-x64.zip 内即 `Angles.Desktop.exe`
          files: Angles-Desktop-win-x64.zip
